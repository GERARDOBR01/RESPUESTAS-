<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="vidrio">
    <header>
      <img class="logo" src="iconos/icono-48.png" alt="" width="22" height="22">
      <h1>Raven · respuestas</h1>
      <span id="contador" class="contador">0 / 60</span>
    </header>

    <p id="pagina" class="pagina"></p>

    <div id="otra" class="otra" hidden>
      <span>Estas respuestas se capturaron para <strong>otro candidato</strong> (otra cédula).</span>
      <button id="nueva" class="secundario" type="button">Empezar captura nueva</button>
    </div>

    <div id="rejilla" class="rejilla"></div>

    <p class="ayuda">Escribe un número y salta sola a la siguiente; se guarda al momento. En la página del Raven también tienes el botón «Llenar respuestas».</p>

    <div class="botones">
      <button id="borrar" class="secundario" type="button">Borrar todo</button>
      <button id="llenar" class="primario" type="button">Llenar página</button>
    </div>

    <p id="estado" class="estado"></p>
  </main>

  <script src="cedula.js"></script>
  <script src="analizar.js"></script>
  <script src="llenar.js"></script>
  <script src="popup.js"></script>
</body>
</html>
