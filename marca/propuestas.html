<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logo · propuestas</title>
<style>
  :root { --texto: #1d2433; --tenue: #5b6475; }
  body {
    margin: 0; padding: 32px; min-height: 100vh; box-sizing: border-box; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; color: var(--texto);
    background:
      radial-gradient(circle at 10% 0%, rgba(229, 72, 77, 0.18), transparent 40%),
      radial-gradient(circle at 95% 100%, rgba(30, 136, 229, 0.2), transparent 45%), #eef1f6;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.sub { margin: 0 0 24px; color: var(--tenue); }
  .propuestas { display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr)); gap: 20px; }
  .tarjeta {
    padding: 20px; border-radius: 16px; background: rgba(255, 255, 255, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 6px 24px rgba(29, 36, 51, 0.1);
  }
  .tarjeta h2 { margin: 0; font-size: 17px; }
  .tarjeta p { margin: 4px 0 16px; color: var(--tenue); font-size: 13.5px; }
  .grande svg { width: 128px; height: 128px; display: block; margin: 0 auto 16px; }
  .barras { display: grid; gap: 8px; }
  .barra { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-radius: 10px; font-size: 12px; }
  .barra.clara { background: #f1f3f4; color: #444; }
  .barra.oscura { background: #35363a; color: #ddd; }
  .barra svg { flex: none; }
</style>
</head>
<body>
<h1>Raven · llenar respuestas — propuestas de logo</h1>
<p class="sub">Vidrio con punto rojo, como tus otras herramientas. Colores propios (azul marino), distintos del azul de PsicoWeb, para que no parezca oficial de ellos.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3550"/><stop offset="1" stop-color="#151b2b"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.15" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#e5484d" stop-opacity="0.35"/><stop offset="0.55" stop-color="#e5484d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="0.95" cy="1" r="0.8">
      <stop offset="0" stop-color="#1e88e5" stop-opacity="0.45"/><stop offset="0.6" stop-color="#1e88e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#dfe6f3" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="rojo" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff7a7e"/><stop offset="1" stop-color="#d83a40"/>
    </radialGradient>

    <g id="tile">
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#fondo)"/>
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#aurora)"/>
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#aurora2)"/>
      <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>
    </g>

    <!-- A · Matriz 3×3: la pieza que falta es el punto rojo -->
    <symbol id="A" viewBox="0 0 128 128">
      <use href="#tile"/>
      <g fill="url(#vidrio)">
        <rect x="28" y="28" width="20" height="20" rx="6"/><rect x="54" y="28" width="20" height="20" rx="6"/><rect x="80" y="28" width="20" height="20" rx="6"/>
        <rect x="28" y="54" width="20" height="20" rx="6"/><rect x="54" y="54" width="20" height="20" rx="6"/><rect x="80" y="54" width="20" height="20" rx="6"/>
        <rect x="28" y="80" width="20" height="20" rx="6"/><rect x="54" y="80" width="20" height="20" rx="6"/>
      </g>
      <circle cx="90" cy="90" r="11" fill="url(#rojo)"/>
      <circle cx="90" cy="90" r="15" fill="none" stroke="#e5484d" stroke-opacity="0.35" stroke-width="3"/>
    </symbol>

    <!-- B · Matriz 2×2: la misma idea, más gruesa para que se lea a 16 px -->
    <symbol id="B" viewBox="0 0 128 128">
      <use href="#tile"/>
      <g fill="url(#vidrio)">
        <rect x="30" y="30" width="30" height="30" rx="9"/><rect x="68" y="30" width="30" height="30" rx="9"/>
        <rect x="30" y="68" width="30" height="30" rx="9"/>
      </g>
      <circle cx="83" cy="83" r="14" fill="url(#rojo)"/>
      <circle cx="83" cy="83" r="19" fill="none" stroke="#e5484d" stroke-opacity="0.35" stroke-width="3.5"/>
    </symbol>

    <!-- C · Monograma R: la pierna de la R termina en el punto rojo -->
    <symbol id="C" viewBox="0 0 128 128">
      <use href="#tile"/>
      <path d="M40 98 V30 H70 a20 20 0 0 1 0 40 H40" fill="none" stroke="url(#vidrio)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M64 70 L80 88" fill="none" stroke="url(#vidrio)" stroke-width="13" stroke-linecap="round"/>
      <circle cx="90" cy="98" r="10" fill="url(#rojo)"/>
    </symbol>
  </defs>
</svg>

<div class="propuestas" id="propuestas"></div>

<script>
  const datos = [
    ['A', 'A · Matriz', 'Una matriz de 3×3 a la que le falta una pieza, como en el Raven; la pieza que falta es el punto rojo: «la que se llena».'],
    ['B', 'B · Matriz gruesa', 'La misma idea con menos piezas y más grandes. Es la que mejor se lee en la barra de Chrome (16 px).'],
    ['C', 'C · Monograma R', 'Una R de trazo grueso cuya pierna termina en el punto rojo. Más «marca», menos «prueba».'],
  ];
  const usar = (id, t) => `<svg width="${t}" height="${t}" viewBox="0 0 128 128"><use href="#${id}"/></svg>`;
  document.getElementById('propuestas').innerHTML = datos.map(([id, titulo, texto]) => `
    <section class="tarjeta">
      <div class="grande">${usar(id, 128)}</div>
      <h2>${titulo}</h2><p>${texto}</p>
      <div class="barras">
        <div class="barra clara">${usar(id, 16)} ${usar(id, 32)} ${usar(id, 48)} <span>barra clara · 16 / 32 / 48</span></div>
        <div class="barra oscura">${usar(id, 16)} ${usar(id, 32)} ${usar(id, 48)} <span>barra oscura · 16 / 32 / 48</span></div>
      </div>
    </section>`).join('');
</script>
</body>
</html>
